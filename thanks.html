<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grazie — DIANA</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #FFFFFF;
    --text: #1A1A1A;
    --accent: #3B82F6;
    --accent-dark: #2563EB;
    --nav-h: 64px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    line-height: 1.5; padding-top: var(--nav-h);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* Navigazione */
  nav {
    position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h);
    background: rgba(255,255,255,.95); backdrop-filter: blur(8px);
    border-bottom: 1px solid #E5E7EB;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; z-index: 100;
  }
  .logo { font-weight: 900; letter-spacing: .15em; font-size: 1.1rem; }
  nav ul { display: flex; gap: 28px; list-style: none; }
  nav ul a {
    font-size: .85rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em;
    padding: 6px 0; border-bottom: 2px solid transparent; transition: border-color .2s, color .2s;
  }
  nav ul a:hover { color: var(--accent); border-color: var(--accent); }

  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 64px 24px; position: relative; z-index: 1;
  }
  .check {
    width: 128px; height: 128px; border-radius: 50%; background: var(--accent);
    display: flex; align-items: center; justify-content: center; margin-bottom: 40px;
    animation: pop .6s cubic-bezier(.3,1.6,.5,1) both;
  }
  .check svg { width: 64px; height: 64px; fill: none; stroke: #fff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
  .check path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .5s ease-out .45s forwards; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  h1 {
    font-size: clamp(2.2rem, 8vw, 4.5rem); font-weight: 900; text-transform: uppercase;
    letter-spacing: .03em; line-height: 1.05; position: relative; padding-bottom: 16px; display: inline-block;
  }
  h1::after {
    content: ""; position: absolute; left: 0; bottom: 0; height: 6px; width: 100%; border-radius: 3px;
    background: linear-gradient(90deg, #93C5FD, #3B82F6, #1D4ED8);
  }
  p { margin: 24px 0 36px; font-size: 1.15rem; color: #555; max-width: 460px; }

  .btn {
    display: inline-block; background: var(--accent); color: #fff;
    font-weight: 700; font-size: .9rem; text-transform: uppercase; letter-spacing: .1em;
    padding: 16px 36px; border-radius: 999px; transition: background .2s, transform .2s;
  }
  .btn:hover { background: var(--accent-dark); transform: translateY(-2px); }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

  footer { text-align: center; padding: 32px 24px; font-size: .8rem; color: #777; border-top: 1px solid #E5E7EB; position: relative; z-index: 1; background: var(--bg); }

  @media (max-width: 720px) {
    nav { padding: 0 16px; justify-content: center; }
    nav ul { gap: 16px; }
    nav ul a { font-size: .7rem; letter-spacing: .05em; }
    .logo { display: none; }
    .check { width: 104px; height: 104px; margin-bottom: 32px; }
    .check svg { width: 52px; height: 52px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .check, .check path { animation: none; stroke-dashoffset: 0; }
    #confetti { display: none; }
  }
</style>
</head>
<body>

<nav aria-label="Navigazione principale">
  <a href="index.html" class="logo">DIANA</a>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="index.html#musica">Musica</a></li>
    <li><a href="merch.html">Merchandising</a></li>
    <li><a href="tour.html">Tour</a></li>
  </ul>
</nav>

<canvas id="confetti" aria-hidden="true"></canvas>

<main>
  <div class="check" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  </div>
  <h1>Ordine confermato!</h1>
  <p>Grazie per aver sostenuto Diana. Il tuo ordine è in arrivo.</p>
  <a class="btn" href="index.html">Torna al sito</a>
</main>

<footer>© 2026 Diana. Tutti i diritti riservati.</footer>

<script>
  (function () {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var canvas = document.getElementById('confetti');
    var ctx = canvas.getContext('2d');
    var colors = ['#3B82F6', '#93C5FD', '#1D4ED8', '#1A1A1A'];
    var pieces = [], w, h, start = performance.now(), DURATION = 4500;

    function resize() {
      var dpr = window.devicePixelRatio || 1;
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    var count = Math.min(90, Math.round(w / 14));
    for (var i = 0; i < count; i++) {
      pieces.push({
        x: Math.random() * w,
        y: -20 - Math.random() * h * 0.6,
        size: 6 + Math.random() * 6,
        vy: 1.2 + Math.random() * 1.6,
        sway: Math.random() * 2 * Math.PI,
        swaySpeed: 0.02 + Math.random() * 0.03,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.12,
        color: colors[i % colors.length]
      });
    }

    function frame(now) {
      var t = now - start;
      ctx.clearRect(0, 0, w, h);
      var alive = false;
      // dissolvenza nell'ultimo secondo
      ctx.globalAlpha = t > DURATION - 1000 ? Math.max(0, (DURATION - t) / 1000) : 1;
      pieces.forEach(function (p) {
        p.y += p.vy; p.sway += p.swaySpeed; p.rot += p.vr;
        var x = p.x + Math.sin(p.sway) * 24;
        if (p.y < h + 20) alive = true;
        ctx.save();
        ctx.translate(x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      });
      if (alive && t < DURATION) requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
